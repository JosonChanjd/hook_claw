name: 每日股票自动策略

on:
  schedule:
    - cron: '0 8 * * *' # 北京时间 16:00
  workflow_dispatch: 

jobs:
  stock_job:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 jq git

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          # 直接使用修改后的 requirements.txt
          pip install -r requirements.txt

      - name: 预创建文件夹
        run: mkdir -p Scan_Reports combined_reports

      - name: 运行全市场扫描 (SAT_1Y.py)
        run: |
          python SAT_1Y.py > scan.log 2>&1 || echo "脚本运行中..."
          tail -n 20 scan.log
          {
            echo "RES1<<EOF"
            if [ -f scan.log ]; then tail -n 15 scan.log; else echo "日志不存在"; fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 运行单股分析 (SAT.py)
        run: |
          python SAT.py > single.log 2>&1 || echo "脚本运行中..."
          tail -n 10 single.log
          {
            echo "RES2<<EOF"
            if [ -f single.log ]; then tail -n 8 single.log; else echo "日志不存在"; fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 构建 JSON 并发送飞书
        if: always()
        run: |
          if [ -z "${{ secrets.FEISHU_WEBHOOK }}" ]; then
            echo "::error::未发现 FEISHU_WEBHOOK Secret！"
            exit 1
          fi

          TITLE="📊 每日量化策略扫描报告"
          R1="${RES1:-'无扫描输出'}"
          R2="${RES2:-'无分析输出'}"

          JSON_DATA=$(jq -n \
            --arg title "$TITLE" \
            --arg r1 "$R1" \
            --arg r2 "$R2" \
            '{title: $title, result1: $r1, result2: $r2}')

          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d "$JSON_DATA"

      - name: 保存报告文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strategy-Reports
          path: |
            *.csv
            Scan_Reports/
            combined_reports/
