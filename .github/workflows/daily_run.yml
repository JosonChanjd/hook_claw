name: 每日股票自动策略

on:
  schedule:
    - cron: '0 8 * * *' # 北京时间 16:00
  workflow_dispatch: 

jobs:
  stock_job:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 jq

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 确保 bokeh 版本兼容，防止报 'js_on_event' 错误
          pip install bokeh==2.4.3 

      - name: 预创建文件夹
        run: mkdir -p Scan_Reports combined_reports

      - name: 运行全市场扫描 (SAT_1Y.py)
        run: |
          # 运行脚本，即使报错也不会中断后续步骤
          python SAT_1Y.py || true
          
          # 【这里必须是 if 空格 [ 】
          if [ -f "feishu_msg_1.txt" ]; then
            MSG1=$(cat feishu_msg_1.txt)
          else
            MSG1="❌ 脚本 SAT_1Y.py 未能正常运行，未生成报告文本。"
          fi
          
          # 写入环境变量供后续使用
          echo "RES1<<EOF" >> $GITHUB_ENV
          echo "$MSG1" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 运行单股分析 (SAT.py)
        run: |
          python SAT.py || true
          
          # 【这里必须是 if 空格[ 】
          if [ -f "feishu_msg_2.txt" ]; then
            MSG2=$(cat feishu_msg_2.txt)
          else
            MSG2="❌ 脚本 SAT.py 未能正常运行，未生成报告文本。"
          fi
          
          echo "RES2<<EOF" >> $GITHUB_ENV
          echo "$MSG2" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 构建 JSON 并发送飞书
        if: always()
        run: |
          # 【这里必须是 if 空格 [ 】
          if [ -z "${{ secrets.FEISHU_WEBHOOK }}" ]; then
            echo "::error::未配置 FEISHU_WEBHOOK，请在 GitHub Settings 添加！"
            exit 1
          fi

          # 使用 jq 安全地构建 JSON
          JSON_DATA=$(jq -n \
            --arg title "📊 每日量化策略扫描报告" \
            --arg r1 "${RES1}" \
            --arg r2 "${RES2}" \
            '{title: $title, result1: $r1, result2: $r2}')

          # 发送给飞书
          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d "$JSON_DATA"

      - name: 保存报告文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strategy-Reports
          path: |
            *.csv
            Scan_Reports/
            combined_reports/
