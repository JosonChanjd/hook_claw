name: 每日股票自动策略

on:
  schedule:
    # 每天北京时间 16:00 运行 (UTC 8:00)
    - cron: '0 8 * * *'
  workflow_dispatch: 

jobs:
  stock_job:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          # 必须安装 bokeh 2.4.3 否则 backtesting 绘图会报错
          pip install numpy pandas pandas_ta efinance backtesting tqdm requests bokeh==2.4.3

      - name: 运行全市场扫描 (SAT_1Y.py)
        id: scan
        run: |
          # 运行全市场扫描
          python SAT_1Y.py > scan.log 2>&1 || true
          # 提取输出中包含表格的部分（通常在“扫描完成”字样后面）
          # 我们取最后 20 行，这通常包含了前 10 名的表格
          SUMMARY1=$(tail -n 20 scan.log)
          echo "RES1<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY1" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 运行股票分析 (SAT.py)
        id: analyze
        run: |
          # 运行股票分析 (注意：目前你代码里写死的是 002703)
          python SAT.py > single.log 2>&1 || true
          # 提取最后 8 行（汇总信息）
          SUMMARY2=$(tail -n 8 single.log)
          echo "RES2<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY2" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 构建 JSON 并发送飞书
        if: always()
        run: |
          # 使用 jq 确保多行文本被正确转义成 JSON 字符串
          JSON_DATA=$(jq -n \
            --arg title "📊 每日量化策略扫描报告 (${{ github.run_id }})" \
            --arg r1 "$RES1" \
            --arg r2 "$RES2" \
            '{title: $title, result1: $r1, result2: $r2}')

          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d "$JSON_DATA"

      - name: 保存报告文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 策略报告_${{ github.run_id }}
          path: |
            A_Share_Scan_Result.csv
            Scan_Reports/
            combined_reports/
