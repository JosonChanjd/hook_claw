name: 每日股票自动策略

on:
  schedule:
    - cron: '0 8 * * *' # 北京时间 16:00
  workflow_dispatch: 

jobs:
  stock_job:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 jq

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          # 因为 requirements.txt 已经改好了，这一步将无比顺畅！
          pip install -r requirements.txt

      - name: 预创建文件夹
        run: mkdir -p Scan_Reports combined_reports

      - name: 运行全市场扫描 (SAT_1Y.py)
        run: |
          python SAT_1Y.py > scan.log 2>&1 || true
          {
            echo "RES1<<EOF"
            tail -n 15 scan.log || echo "扫描日志无内容"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 运行单股分析 (SAT.py)
        run: |
          python SAT.py > single.log 2>&1 || true
          {
            echo "RES2<<EOF"
            tail -n 8 single.log || echo "分析日志无内容"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 构建 JSON 并发送飞书
        if: always()
        run: |
          if [ -z "${{ secrets.FEISHU_WEBHOOK }}" ]; then
            echo "::error::未配置 FEISHU_WEBHOOK，请在 GitHub Settings 添加！"
            exit 1
          fi

          JSON_DATA=$(jq -n \
            --arg title "📊 每日量化策略扫描报告" \
            --arg r1 "${RES1:-'无输出'}" \
            --arg r2 "${RES2:-'无输出'}" \
            '{title: $title, result1: $r1, result2: $r2}')

          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d "$JSON_DATA"

      - name: 保存报告文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strategy-Reports
          path: |
            *.csv
            Scan_Reports/
            combined_reports/
