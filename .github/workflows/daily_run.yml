name: 每日股票自动策略

on:
  schedule:
    - cron: '0 8 * * *' # 北京时间 16:00
  workflow_dispatch: 

jobs:
  stock_job:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # 3.9 是目前量化分析兼容性最好的版本

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 jq

      - name: 安装基础 Python 库
        run: |
          python -m pip install --upgrade pip
          # 强制锁定旧版 pandas，防止被最新版 3.0 破坏
          pip install "numpy<2.0.0" "pandas<2.0.0" "bokeh<3.0.0"
          pip install efinance tqdm requests backtesting

      - name: 强制安装 pandas-ta (从源码安装)
        run: |
          # 既然 PyPI 找不到，我们直接从作者的 GitHub 仓库安装最新开发版
          pip install git+https://github.com/twopirllc/pandas-ta.git@development

      - name: 预创建文件夹
        run: |
          mkdir -p Scan_Reports
          mkdir -p combined_reports

      - name: 运行全市场扫描 (SAT_1Y.py)
        run: |
          # 运行脚本并将结果输出到日志
          python SAT_1Y.py > scan.log 2>&1 || echo "脚本运行中..."
          tail -n 20 scan.log
          {
            echo "RES1<<EOF"
            tail -n 15 scan.log
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 运行单股分析 (SAT.py)
        run: |
          python SAT.py > single.log 2>&1 || echo "脚本运行中..."
          tail -n 10 single.log
          {
            echo "RES2<<EOF"
            tail -n 8 single.log
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 构建 JSON 并发送飞书
        if: always()
        run: |
          # 检查 Secret 是否配置（你之前的报错显示 curl URL 为空）
          if [ -z "${{ secrets.FEISHU_WEBHOOK }}" ]; then
            echo "::error::未发现 FEISHU_WEBHOOK！请在 GitHub 仓库 Settings -> Secrets 中添加它。"
            exit 1
          fi

          TITLE="📊 每日量化策略扫描报告"
          R1="${RES1:-'脚本未产生有效输出，请检查 scan.log'}"
          R2="${RES2:-'单股分析未产生有效输出'}"

          JSON_DATA=$(jq -n \
            --arg title "$TITLE" \
            --arg r1 "$R1" \
            --arg r2 "$R2" \
            '{title: $title, result1: $r1, result2: $r2}')

          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d "$JSON_DATA"

      - name: 保存报告文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strategy-Reports
          path: |
            *.csv
            Scan_Reports/*
            combined_reports/*
