name: 每日股票自动策略

on:
  schedule:
    - cron: '0 8 * * *' # 北京时间 16:00
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  stock_job:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 强制回到最稳定的 3.10
          # 注意：暂时关闭 cache 以确保干净的安装环境
          
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 jq

      - name: 强制安装旧版核心库 (解决 Pandas 3.0 冲突)
        run: |
          python -m pip install --upgrade pip
          # 关键一步：先强制安装 1.x 版本的 numpy 和 pandas，防止被 3.0 污染
          pip install "numpy<2.0.0" "pandas<2.1.0" "bokeh<3.0.0"
          
      - name: 安装量化策略库
        run: |
          # 此时安装 pandas-ta 就能找到兼容 1.x 版 pandas 的版本了
          pip install pandas-ta
          pip install efinance tqdm requests backtesting

      - name: 预创建文件夹
        run: |
          mkdir -p Scan_Reports
          mkdir -p combined_reports

      - name: 运行全市场扫描 (SAT_1Y.py)
        id: scan
        run: |
          # 运行脚本
          python SAT_1Y.py > scan.log 2>&1 || echo "脚本运行中..."
          tail -n 20 scan.log
          {
            echo "RES1<<EOF"
            tail -n 15 scan.log
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 运行单股分析 (SAT.py)
        id: analyze
        run: |
          python SAT.py > single.log 2>&1 || echo "脚本运行中..."
          tail -n 10 single.log
          {
            echo "RES2<<EOF"
            tail -n 8 single.log
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 构建 JSON 并发送飞书
        if: always()
        run: |
          # 检查 Secret
          if [ -z "${{ secrets.FEISHU_WEBHOOK }}" ]; then
            echo "错误: 未配置 FEISHU_WEBHOOK"
            exit 1
          fi

          TITLE="📊 每日量化策略扫描报告"
          R1="${RES1:-'无扫描输出，请检查日志'}"
          R2="${RES2:-'无分析输出'}"

          JSON_DATA=$(jq -n \
            --arg title "$TITLE" \
            --arg r1 "$R1" \
            --arg r2 "$R2" \
            '{title: $title, result1: $r1, result2: $r2}')

          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d "$JSON_DATA"

      - name: 保存报告文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strategy-Reports
          path: |
            *.csv
            Scan_Reports/*
            combined_reports/*
