name: 每日股票自动策略

on:
  schedule:
    - cron: '0 8 * * *' # 北京时间 16:00
  workflow_dispatch: 

jobs:
  stock_job:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 jq

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          
          # 1. 先安装确定的核心版本，防止被自动升级到 3.0
          pip install "numpy<2.0.0" "pandas<2.1.0" "bokeh<3.0.0"
          
          # 2. 安装其他基础库
          pip install efinance tqdm requests backtesting
          
          # 3. 【重点】直接从源码安装 pandas-ta，解决 PyPI 找不到包的问题
          pip install https://github.com/twopirllc/pandas-ta/archive/master.zip

      - name: 预创建文件夹
        run: |
          mkdir -p Scan_Reports
          mkdir -p combined_reports

      - name: 运行全市场扫描 (SAT_1Y.py)
        id: scan
        run: |
          # 运行脚本
          python SAT_1Y.py > scan.log 2>&1 || echo "脚本运行中..."
          tail -n 20 scan.log
          {
            echo "RES1<<EOF"
            tail -n 15 scan.log
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 运行单股分析 (SAT.py)
        id: analyze
        run: |
          python SAT.py > single.log 2>&1 || echo "脚本运行中..."
          tail -n 10 single.log
          {
            echo "RES2<<EOF"
            tail -n 8 single.log
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 构建 JSON 并发送飞书
        if: always()
        run: |
          # 最后的防错检查：如果 Secret 为空，打印明确提示
          if [ -z "${{ secrets.FEISHU_WEBHOOK }}" ]; then
            echo "::error::未发现 FEISHU_WEBHOOK！请在 GitHub Settings -> Secrets 中添加它。"
            exit 1
          fi

          TITLE="📊 每日量化策略扫描报告"
          R1="${RES1:-'无扫描输出'}"
          R2="${RES2:-'无分析输出'}"

          JSON_DATA=$(jq -n \
            --arg title "$TITLE" \
            --arg r1 "$R1" \
            --arg r2 "$R2" \
            '{title: $title, result1: $r1, result2: $r2}')

          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d "$JSON_DATA"

      - name: 保存报告文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strategy-Reports
          path: |
            *.csv
            Scan_Reports/*
            combined_reports/*
