name: 每日股票自动策略

on:
  schedule:
    - cron: '0 8 * * *' # 北京时间 16:00
  workflow_dispatch: 

jobs:
  stock_job:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # 3.9 是对旧量化库兼容性最好的版本

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 jq git

      - name: 安装基础 Python 依赖
        run: |
          python -m pip install --upgrade pip
          # 1. 先安装确定的核心库，防止版本冲突
          pip install "numpy<2.0.0" "pandas<2.0.0" "bokeh==2.4.3"
          # 2. 安装其余库（跳过 requirements 中可能的 pandas-ta 报错）
          pip install efinance tqdm requests backtesting

      - name: 强制安装 pandas-ta (跳过官方索引，直接拉取源码)
        run: |
          # 这一行是解决所有问题的核心，它直接下载源码安装，不走 PyPI 检索
          pip install git+https://github.com/twopirllc/pandas-ta.git@development

      - name: 预创建文件夹
        run: mkdir -p Scan_Reports combined_reports

      - name: 运行全市场扫描 (SAT_1Y.py)
        run: |
          # 运行脚本
          python SAT_1Y.py > scan.log 2>&1 || echo "脚本运行中..."
          # 打印日志以便调试
          cat scan.log | tail -n 20
          {
            echo "RES1<<EOF"
            tail -n 15 scan.log || echo "无日志输出"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 运行单股分析 (SAT.py)
        run: |
          python SAT.py > single.log 2>&1 || echo "脚本运行中..."
          cat single.log | tail -n 10
          {
            echo "RES2<<EOF"
            tail -n 8 single.log || echo "无日志输出"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 构建 JSON 并发送飞书
        if: always()
        run: |
          # 检查 Secret 是否配置
          if [ -z "${{ secrets.FEISHU_WEBHOOK }}" ]; then
            echo "::error::未发现 FEISHU_WEBHOOK！请在 GitHub 仓库 Settings -> Secrets 中添加它。"
            exit 1
          fi

          TITLE="📊 每日量化策略扫描报告"
          R1="${RES1:-'未获取到扫描摘要'}"
          R2="${RES2:-'未获取到单股分析摘要'}"

          JSON_DATA=$(jq -n \
            --arg title "$TITLE" \
            --arg r1 "$R1" \
            --arg r2 "$R2" \
            '{title: $title, result1: $r1, result2: $r2}')

          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d "$JSON_DATA"

      - name: 保存报告文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strategy-Reports
          path: |
            *.csv
            Scan_Reports/
            combined_reports/
