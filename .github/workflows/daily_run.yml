name: 每日股票自动策略

on:
  schedule:
    - cron: '0 8 * * *' # 北京时间 16:00
  workflow_dispatch: 

env:
  # 强制使用 Node 24 解决之前的警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  stock_job:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 升级到 3.11 解决 pandas 兼容性问题
          cache: 'pip'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx jq

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          # 先安装核心库，再安装特定版本的 bokeh 以适配 backtesting
          pip install numpy pandas efinance tqdm requests
          pip install pandas-ta 
          pip install bokeh==2.4.3 
          pip install backtesting

      - name: 预创建文件夹
        run: |
          mkdir -p Scan_Reports
          mkdir -p combined_reports

      - name: 运行全市场扫描 (SAT_1Y.py)
        id: scan
        run: |
          # 运行脚本
          python SAT_1Y.py > scan.log 2>&1 || echo "脚本运行完成(含警告)"
          # 打印部分日志到控制台
          tail -n 20 scan.log
          # 捕获结果给飞书变量
          echo "RES1<<EOF" >> $GITHUB_ENV
          tail -n 15 scan.log >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 运行单股分析 (SAT.py)
        id: analyze
        run: |
          python SAT.py > single.log 2>&1 || echo "脚本运行完成(含警告)"
          tail -n 10 single.log
          echo "RES2<<EOF" >> $GITHUB_ENV
          tail -n 8 single.log >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 构建 JSON 并发送飞书
        if: always()
        run: |
          # 确保环境变量不为空，防止 curl 报错
          TITLE="📊 每日量化策略扫描报告"
          R1="${RES1:-'无扫描数据'}"
          R2="${RES2:-'无单股分析数据'}"

          # 使用 jq 封装 JSON，防止特殊字符导致 curl 失败
          JSON_DATA=$(jq -n \
            --arg title "$TITLE" \
            --arg r1 "$R1" \
            --arg r2 "$R2" \
            '{title: $title, result1: $r1, result2: $r2}')

          # 发送请求，请确保已在 Settings -> Secrets 中添加 FEISHU_WEBHOOK
          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d "$JSON_DATA"

      - name: 保存报告文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strategy-Reports
          path: |
            *.csv
            Scan_Reports/
            combined_reports/
