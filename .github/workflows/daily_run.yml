name: 每日股票自动策略

on:
  schedule:
    - cron: '0 8 * * *' # 北京时间 16:00
  workflow_dispatch: 

# 解决 Node.js 20 警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  stock_job:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装系统依赖
        # backtesting 绘图可能需要系统级的库支持
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install numpy pandas pandas_ta efinance backtesting tqdm requests bokeh==2.4.3

      - name: 预创建文件夹
        # 强制创建脚本中需要的文件夹，防止脚本因权限或路径问题失败
        run: |
          mkdir -p Scan_Reports
          mkdir -p combined_reports

      - name: 运行全市场扫描 (SAT_1Y.py)
        id: scan
        run: |
          # 运行脚本，并将错误也输出到日志中
          python SAT_1Y.py > scan.log 2>&1 || echo "SAT_1Y 运行中出现了一些非致命错误"
          # 打印日志最后几行到控制台方便调试
          tail -n 20 scan.log
          # 捕获结果给飞书
          echo "RES1<<EOF" >> $GITHUB_ENV
          tail -n 15 scan.log >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 运行单股分析 (SAT.py)
        id: analyze
        run: |
          python SAT.py > single.log 2>&1 || echo "SAT 运行中出现了一些非致命错误"
          tail -n 10 single.log
          echo "RES2<<EOF" >> $GITHUB_ENV
          tail -n 8 single.log >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 检查文件是否存在 (Debug)
        run: |
          echo "--- 检查生成的报表文件 ---"
          ls -R

      - name: 构建 JSON 并发送飞书
        if: always()
        run: |
          # 使用 jq 封装 JSON
          JSON_DATA=$(jq -n \
            --arg title "📊 每日量化策略扫描报告" \
            --arg r1 "$RES1" \
            --arg r2 "$RES2" \
            '{title: $title, result1: $r1, result2: $r2}')

          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d "$JSON_DATA"

      - name: 保存报告文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strategy-Reports
          # 使用通配符，如果文件夹为空也不会报错
          path: |
            *.csv
            Scan_Reports/*
            combined_reports/*
