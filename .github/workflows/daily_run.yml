name: 每日股票自动策略

on:
  schedule:
    - cron: '0 8 * * *' # 北京时间 16:00
  workflow_dispatch: 

jobs:
  stock_job:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 强制设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # 这里不使用 cache，确保每次都是干净的 3.10 环境

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 jq

      - name: 强制安装旧版兼容依赖
        run: |
          python -m pip install --upgrade pip
          
          # 1. 强制安装旧版核心库，这是解决所有问题的关键
          # 不要让系统自动选 3.0 版本，手动指定 1.5.3 和 1.26.4
          pip install --only-binary=:all: "numpy==1.26.4" "pandas==1.5.3" "bokeh==2.4.3"
          
          # 2. 安装策略库和数据库
          # 因为上面锁死了 pandas 1.5.3，这时候安装 pandas-ta 就会非常顺利
          pip install pandas-ta efinance tqdm requests backtesting

      - name: 预创建文件夹
        run: |
          mkdir -p Scan_Reports
          mkdir -p combined_reports

      - name: 运行全市场扫描 (SAT_1Y.py)
        id: scan
        run: |
          # 运行脚本
          python SAT_1Y.py > scan.log 2>&1 || echo "脚本运行中..."
          tail -n 20 scan.log
          {
            echo "RES1<<EOF"
            tail -n 15 scan.log
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 运行单股分析 (SAT.py)
        id: analyze
        run: |
          python SAT.py > single.log 2>&1 || echo "脚本运行中..."
          tail -n 10 single.log
          {
            echo "RES2<<EOF"
            tail -n 8 single.log
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 构建 JSON 并发送飞书
        if: always()
        run: |
          # 检查 Secret
          if [ -z "${{ secrets.FEISHU_WEBHOOK }}" ]; then
            echo "错误: 你没有在 GitHub Settings -> Secrets 中配置 FEISHU_WEBHOOK"
            exit 1
          fi

          TITLE="📊 每日量化策略扫描报告"
          # 处理空变量，防止 curl 失败
          R1="${RES1:-'脚本未产生摘要内容'}"
          R2="${RES2:-'脚本未产生分析内容'}"

          JSON_DATA=$(jq -n \
            --arg title "$TITLE" \
            --arg r1 "$R1" \
            --arg r2 "$R2" \
            '{title: $title, result1: $r1, result2: $r2}')

          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d "$JSON_DATA"

      - name: 保存报告文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strategy-Reports
          path: |
            *.csv
            Scan_Reports/*
            combined_reports/*
