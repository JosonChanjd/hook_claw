name: 每日股票自动策略

on:
  schedule:
    - cron: '0 8 * * *' # 北京时间 16:00
  workflow_dispatch: 

jobs:
  stock_job:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 jq git

      - name: 安装基础 Python 依赖
        run: |
          python -m pip install --upgrade pip
          # 1. 强制安装旧版核心库，防止被最新 3.0 版本破坏
          pip install "numpy<2.0.0" "pandas<2.0.0" "bokeh==2.4.3"
          # 2. 安装其他必需库
          pip install efinance tqdm requests backtesting

      - name: 终极安装 pandas-ta (从 GitHub 源码直接拉取)
        run: |
          # 既然官方包名搜不到，我们直接用 git 协议安装作者的最新开发分支
          # 这是绕过 "No matching distribution" 报错的唯一方法
          pip install "pandas_ta @ git+https://github.com/twopirllc/pandas-ta.git@development"

      - name: 预创建文件夹
        run: |
          mkdir -p Scan_Reports
          mkdir -p combined_reports

      - name: 运行全市场扫描 (SAT_1Y.py)
        id: step_scan
        run: |
          # 运行全市场扫描
          python SAT_1Y.py > scan.log 2>&1 || echo "脚本执行中出现警告或非致命错误"
          tail -n 20 scan.log
          {
            echo "RES1<<EOF"
            # 截取最后15行，如果文件不存在则输出提示
            if [ -f scan.log ]; then tail -n 15 scan.log; else echo "scan.log 不存在"; fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 运行单股分析 (SAT.py)
        id: step_analyze
        run: |
          python SAT.py > single.log 2>&1 || echo "脚本执行中出现警告或非致命错误"
          tail -n 10 single.log
          {
            echo "RES2<<EOF"
            if [ -f single.log ]; then tail -n 8 single.log; else echo "single.log 不存在"; fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 构建 JSON 并发送飞书
        if: always()
        run: |
          # 1. 检查 Secret 变量
          if [ -z "${{ secrets.FEISHU_WEBHOOK }}" ]; then
            echo "::error::未发现 FEISHU_WEBHOOK！请在 GitHub 仓库 Settings -> Secrets 中添加它。"
            exit 1
          fi

          # 2. 处理多行文本，将其转换为 JSON 字符串
          TITLE="📊 每日量化策略扫描报告"
          R1="${RES1:-'未获取到扫描摘要'}"
          R2="${RES2:-'未获取到单股分析摘要'}"

          # 3. 使用 jq 强制生成合法的 JSON
          JSON_DATA=$(jq -n \
            --arg title "$TITLE" \
            --arg r1 "$R1" \
            --arg r2 "$R2" \
            '{title: $title, result1: $r1, result2: $r2}')

          # 4. 发送 Webhook
          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d "$JSON_DATA"

      - name: 保存报告文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strategy-Reports
          path: |
            *.csv
            Scan_Reports/
            combined_reports/
