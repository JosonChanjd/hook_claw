name: 每日股票自动策略

on:
  schedule:
    - cron: '0 8 * * *' # 北京时间 16:00
  workflow_dispatch: 

jobs:
  stock_job:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 匹配你报错中要求的 3.12 版本

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 jq git

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          
          # 1. 强制安装兼容 3.12 的核心库版本
          # 锁死 pandas < 3.0.0 是因为 backtesting 还没适配上周发布的 pandas 3.0
          pip install "numpy<2.0.0" "pandas>=2.0.0,<3.0.0" "bokeh==2.4.3"
          
          # 2. 安装基础库
          pip install efinance tqdm requests backtesting
          
          # 3. 终极安装 pandas-ta (直接从 GitHub 源码安装最新开发版)
          # 这样可以绕过 PyPI 的版本检索错误
          pip install git+https://github.com/twopirllc/pandas-ta.git@development

      - name: 预创建文件夹
        run: mkdir -p Scan_Reports combined_reports

      - name: 运行全市场扫描 (SAT_1Y.py)
        run: |
          # 运行脚本
          python SAT_1Y.py > scan.log 2>&1 || echo "脚本运行中..."
          tail -n 20 scan.log
          {
            echo "RES1<<EOF"
            if [ -f scan.log ]; then tail -n 15 scan.log; else echo "日志不存在"; fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 运行单股分析 (SAT.py)
        run: |
          python SAT.py > single.log 2>&1 || echo "脚本运行中..."
          tail -n 10 single.log
          {
            echo "RES2<<EOF"
            if [ -f single.log ]; then tail -n 8 single.log; else echo "日志不存在"; fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 构建 JSON 并发送飞书
        if: always()
        run: |
          # 检查 Secret 是否配置
          if [ -z "${{ secrets.FEISHU_WEBHOOK }}" ]; then
            echo "::error::未配置 FEISHU_WEBHOOK！请在 GitHub Settings -> Secrets 中添加。"
            exit 1
          fi

          TITLE="📊 每日量化策略扫描报告"
          R1="${RES1:-'无扫描输出'}"
          R2="${RES2:-'无分析输出'}"

          JSON_DATA=$(jq -n \
            --arg title "$TITLE" \
            --arg r1 "$R1" \
            --arg r2 "$R2" \
            '{title: $title, result1: $r1, result2: $r2}')

          curl -X POST '${{ secrets.FEISHU_WEBHOOK }}' \
          -H 'Content-Type: application/json' \
          -d "$JSON_DATA"

      - name: 保存报告文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Strategy-Reports
          path: |
            *.csv
            Scan_Reports/
            combined_reports/
